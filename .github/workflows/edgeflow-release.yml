name: EdgeFlow Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build EdgeFlow
        shell: cmd
        run: |
          if not exist EdgeFlow\dist mkdir EdgeFlow\dist
          cl /EHsc /O2 /DNDEBUG /DUNICODE /D_UNICODE EdgeFlow\src\EdgeFlow.cpp /Fe:EdgeFlow\dist\EdgeFlow.exe /link user32.lib

      - name: Package EdgeFlow
        shell: powershell
        run: |
          Compress-Archive -Path EdgeFlow\dist\EdgeFlow.exe -DestinationPath EdgeFlow\dist\EdgeFlow_windows_x64.zip -Force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: EdgeFlow v${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            EdgeFlow/dist/EdgeFlow.exe
            EdgeFlow/dist/EdgeFlow_windows_x64.zip
