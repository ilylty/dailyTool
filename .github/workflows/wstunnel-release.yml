name: WSTunnel Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string
      release_notes:
        description: "Release notes"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          check-latest: true

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p WSTunnel/dist
          OUT=WSTunnel/dist/WSTunnel_${GOOS}_${GOARCH}
          if [ "$GOOS" = "windows" ]; then OUT=${OUT}.exe; fi
          (cd WSTunnel/src && go build -trimpath -ldflags="-s -w" -o "../dist/$(basename "$OUT")" .)

      - name: Package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          FILE=WSTunnel_${GOOS}_${GOARCH}
          if [ "$GOOS" = "windows" ]; then FILE=${FILE}.exe; fi
          (cd WSTunnel/dist && tar -czf ${FILE}.tar.gz ${FILE})

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: WSTunnel v${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            WSTunnel/dist/WSTunnel_${{ matrix.goos }}_${{ matrix.goarch }}*
